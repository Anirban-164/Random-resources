
<h2 class="sr-only">CSE220 lab exam practice — 7 sample questions on LTI systems and convolution</h2>

<style>
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 0 13px;border-bottom:.5px solid var(--border)}
.hdr-t{font-size:15px;font-weight:500;color:var(--text-primary)}
.hdr-s{font-size:12px;color:var(--text-muted)}
.lay{display:flex}
.sdbar{width:196px;flex-shrink:0;border-right:.5px solid var(--border);padding:6px 0}
.qbtn{display:block;width:100%;text-align:left;background:none;border:none;border-left:2px solid transparent;padding:9px 14px;cursor:pointer;font-size:13px;line-height:1.4;color:var(--text-secondary)}
.qbtn:hover{background:var(--surface-1)}
.qbtn.on{border-left-color:var(--fill-accent);background:var(--bg-accent);color:var(--text-primary)}
.qm{font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:5px;margin-bottom:2px}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;display:inline-block}
.de{background:var(--text-success)}.dm{background:var(--text-warning)}.dh{background:var(--text-danger)}
.pane{flex:1;padding:18px 20px;min-width:0}
.qt{font-size:17px;font-weight:500;color:var(--text-primary);margin-bottom:10px}
.bgs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.badge{font-size:11px;padding:2px 8px;border-radius:var(--radius);font-weight:500}
.be{background:var(--bg-success);color:var(--text-success)}
.bm{background:var(--bg-warning);color:var(--text-warning)}
.bh{background:var(--bg-danger);color:var(--text-danger)}
.bk{background:var(--surface-1);color:var(--text-secondary);border:.5px solid var(--border)}
.slbl{font-size:11px;font-weight:500;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;margin:14px 0 5px}
.ptxt{font-size:14px;color:var(--text-primary);line-height:1.7}

pre.fbox,pre.cbox,pre.sbox{background:var(--surface-1);border:.5px solid var(--border);border-radius:var(--radius);padding:10px 14px;font-family:var(--font-mono);color:var(--text-primary);white-space:pre-wrap;margin:0;font-size:13px;line-height:1.8}
pre.cbox{font-size:12px;line-height:1.7}
pre.sbox{font-size:12px;line-height:1.6}
.dvd{border:none;border-top:.5px solid var(--border);margin:14px 0}
.hbtn{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:.5px solid var(--border-strong);border-radius:var(--radius);background:none;font-size:13px;color:var(--text-secondary);cursor:pointer}
.hbtn:hover{background:var(--surface-1);color:var(--text-primary)}
.hbox{margin-top:8px;background:var(--bg-warning);border:.5px solid var(--border-warning);border-radius:var(--radius);padding:11px 14px;font-size:13px;color:var(--text-primary);line-height:1.7;display:none}

.nb{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border:.5px solid var(--border-strong);border-radius:var(--radius);background:none;font-size:13px;color:var(--text-primary);cursor:pointer}

<div class="hdr">
  <span class="hdr-t">CSE220 — lab exam practice</span>
  <span class="hdr-s">7 sample questions · LTI &amp; convolution</span>
</div>
<div class="lay">
  <div class="sdbar" id="sb"></div>
  <div class="pane" id="pn"></div>
</div>

<script>
const E=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const qs=[
{n:1,t:"Signal energy and L2 norm",d:"easy",c:"DiscreteSignal",
p:`Add two methods to <code>DiscreteSignal</code>: <code>energy()</code> returns the total signal energy E, and <code>l2_norm()</code> returns its square root. These appear in SNR calculations and filter analysis.`,
f:"E  =  Σ_n |x[n]|²\nL₂ =  √E",
s:"def energy(self) -> float:\n    ...\n\ndef l2_norm(self) -> float:\n    ...",
i:"x = {x[0]=1, x[1]=2, x[2]=3}\n→ energy   = 1 + 4 + 9 = 14.0\n→ l2_norm  ≈ 3.7417",
h:`Use <code>self.x</code> directly with NumPy — <code>energy</code> is just <code>float(np.sum(self.x**2))</code>. Then <code>l2_norm</code> is <code>float(np.sqrt(self.energy()))</code>.`},

{n:2,t:"Signal subtraction",d:"easy",c:"DiscreteSignal",
p:`Add <code>subtract(self, other)</code> to <code>DiscreteSignal</code>, returning x[n] − other[n] over the union of both time ranges. Then refactor <code>max_absolute_difference()</code> in <code>main.py</code> to use it.`,
f:"z[n] = x[n] - y[n]",
s:`def subtract(self, other) -> "DiscreteSignal":\n    ...`,
i:"x = {x[0]=1, x[1]=2, x[2]=3}\ny = {y[0]=2, y[1]=2}  (zero outside stored range)\n→ z[0]=−1, z[1]=0, z[2]=3",
h:`Copy <code>add()</code> exactly and replace <code>+</code> with <code>-</code>. The union-range logic is identical. In <code>main.py</code>: compute <code>d = a.subtract(b)</code>, then take the max of absolute sample values.`},

{n:3,t:"Causality check",d:"easy",c:"LTISystem",
p:`Add <code>is_causal(self)</code> to <code>LTISystem</code>. An LTI system is causal when h[n] = 0 for all n &lt; 0 — meaning the output at time n depends only on present and past inputs, never future ones.`,
f:"Causal  ⟺  h[n] = 0   for all n < 0",
s:"def is_causal(self) -> bool:\n    ...",
i:"identity    h[0]=1              →  True\nfirst_diff  h[0]=1, h[1]=−1     →  True\ncustom      h[−1]=0.5, h[0]=1   →  False",
h:`Use <code>self.h.nonzero_samples()</code> and check if any entry has time index t &lt; 0. Return <code>False</code> if found, <code>True</code> otherwise. Checking only <code>start_time</code> can be wrong — the stored range might start before 0 but all negative samples could be zero.`},

{n:4,t:"Linearity verification",d:"medium",c:"LTISystem",
p:`Add <code>verify_linearity(self, x1, x2, a, b)</code> to <code>LTISystem</code>. Compute both sides of the superposition equation and return the maximum absolute sample difference. A correct linear system returns 0 (up to floating-point tolerance).`,
f:"LHS = T{ a·x₁[n] + b·x₂[n] }\nRHS = a·T{x₁[n]} + b·T{x₂[n]}\nreturn  max_n |LHS[n] − RHS[n]|",
s:"def verify_linearity(self, x1, x2, a, b) -> float:\n    ...",
i:"x1={1,0,2},  x2={0,3,−1},  a=2, b=0.5\nFor any correct LTI system → max diff ≈ 0.0",
h:`Build combined input: <code>x1.multiply(a).add(x2.multiply(b))</code>.<br>Compute <code>lhs = self.output(combined)</code>.<br>Compute <code>rhs = self.output(x1).multiply(a).add(self.output(x2).multiply(b))</code>.<br>Then iterate over the union range of lhs and rhs to find max |lhs[n]−rhs[n]|.`},

{n:5,t:"Time-invariance verification",d:"medium",c:"LTISystem",
p:`Add <code>verify_time_invariance(self, x, k)</code> to <code>LTISystem</code>. If y[n] is the output for x[n], then the output for x[n−k] must equal y[n−k]. Return the maximum absolute sample difference.`,
f:"x[n] → y[n]   ⟹   x[n−k] → y[n−k]\nreturn  max_n |T{x[n−k]}[n] − y[n−k]|",
s:"def verify_time_invariance(self, x, k) -> float:\n    ...",
i:"x = {1, 0, 2, −1},  k = 3\nFor any correct LTI system → max diff ≈ 0.0",
h:`1. Compute <code>y = self.output(x)</code>.<br>2. <code>y_shifted = y.shift(k)</code>.<br>3. <code>y2 = self.output(x.shift(k))</code>.<br>4. Return max |y_shifted[n] − y2[n]| over the union range of both outputs.`},

{n:6,t:"Cross-correlation",d:"medium",c:"DiscreteSignal",
p:`Add <code>cross_correlate(self, other)</code> to <code>DiscreteSignal</code>, returning R<sub>xy</sub> as a new <code>DiscreteSignal</code>. Cross-correlation measures the similarity of two signals at different lags m. Do not use <code>np.correlate</code> or any built-in convolution.`,
f:"R_xy[m] = Σ_k x[k] · y[k+m]\n\nOutput range:  m ∈ [y.start − x.end,  y.end − x.start]\n\nKey identity:  R_xy[m] = (x[−n] * y[n])[m]",
s:`def cross_correlate(self, other) -> "DiscreteSignal":\n    ...`,
i:"x = {1,2,1} on [0,2],   y = {1,1} on [0,1]\nR_xy[−2]=1,  R_xy[−1]=3,  R_xy[0]=3,  R_xy[1]=1",
h:`Use the key identity: <code>LTISystem(self.reverse()).output(other)</code>. You already have <code>reverse()</code> — the whole method body is two lines!<br>Alternatively, implement a double loop mirroring <code>output_at_time()</code> for each lag m.`},

{n:7,t:"Step response and difference check",d:"hard",c:"LTISystem",
p:`Add <code>step_response(self, n_start, n_end)</code> to <code>LTISystem</code>. Construct a unit step u[n] over [n_start, n_end] (= 1 for n ≥ 0, else 0), compute and return s = T{u}. Also verify the first-difference property: s[n] − s[n−1] = h[n] for every n in h's stored range.`,
f:"u[n] = 1 (n ≥ 0),   0 (n < 0)\ns[n] = (u * h)[n]\n\nFirst-difference property:\ns[n] − s[n−1] = h[n]   for n in h's range",
s:`def step_response(self, n_start, n_end) -> "DiscreteSignal":\n    # also print max |s[n]−s[n−1] − h[n]| as verification`,
i:"h = first_diff = {h[0]=1, h[1]=−1},  u over [0, 6]\ns[0]=1, s[1]=0, …, s[6]=0\ns[0]−s[−1] = 1  = h[0]  ✓\ns[1]−s[0]  = −1 = h[1]  ✓\n(edge artefacts outside h's range are expected)",
h:`Build u: <code>sig = DiscreteSignal(n_start, n_end)</code>, then <code>sig.set_value_at_time(n, 1.0)</code> for each n in range where n &gt;= 0.<br>Call <code>s = self.output(sig)</code>.<br>Diff check: <code>s.subtract(s.shift(-1))</code> gives the first-difference signal; compare against <code>self.h</code> over h's range only. Edge artefacts outside that range are expected due to the truncated step.`}
];

let cur=0,hOpen=false;
const dc=d=>({easy:'de',medium:'dm',hard:'dh'})[d];
const bc=d=>({easy:'be',medium:'bm',hard:'bh'})[d];
const dl=d=>d[0].toUpperCase()+d.slice(1);

function rSB(){
  document.getElementById('sb').innerHTML=qs.map((q,i)=>`
    <button class="qbtn${i===cur?' on':''}" onclick="go(${i})">
      <div class="qm"><span class="dot ${dc(q.d)}"></span>Q${q.n} · ${q.d}</div>
      <div>${q.t}</div>
    </button>`).join('');
}

function rPN(){
  const q=qs[cur];
  document.getElementById('pn').innerHTML=`
    <div class="qt">Q${q.n}: ${q.t}</div>
    <div class="bgs">
      <span class="badge ${bc(q.d)}">${dl(q.d)}</span>
      <span class="badge bk">${q.c}</span>
    </div>
    <div class="slbl">Problem</div>
    <div class="ptxt">${q.p}</div>
    <div class="slbl">Formula</div>
    <pre class="fbox">${E(q.f)}</pre>
    <div class="slbl">Method signature</div>
    <pre class="cbox">${E(q.s)}</pre>
    <div class="slbl">Sample I/O</div>
    <pre class="sbox">${E(q.i)}</pre>
    <div class="dvd"></div>
    <button class="hbtn" id="hb" onclick="tH()">
      <i class="ti ti-bulb" aria-hidden="true" style="font-size:15px"></i>
      ${hOpen?'Hide hint':'Show hint'}
    </button>
    <div class="hbox${hOpen?' open':''}" id="hbx">${q.h}</div>
    <div class="nr">
      <button class="nb" onclick="go(${cur-1})" ${cur===0?'disabled':''}>
        <i class="ti ti-arrow-left" aria-hidden="true" style="font-size:13px"></i> Previous
      </button>
      <button class="nb" onclick="go(${cur+1})" ${cur===qs.length-1?'disabled':''}>
        Next <i class="ti ti-arrow-right" aria-hidden="true" style="font-size:13px"></i>
      </button>
      <span class="nc">${cur+1} of ${qs.length}</span>
    </div>`;
}

function go(i){cur=i;hOpen=false;rSB();rPN();}
function tH(){
  hOpen=!hOpen;
  document.getElementById('hbx').classList.toggle('open',hOpen);
  document.getElementById('hb').innerHTML=`<i class="ti ti-bulb" aria-hidden="true" style="font-size:15px"></i> ${hOpen?'Hide hint':'Show hint'}`;
}
rSB();rPN();
</script>
